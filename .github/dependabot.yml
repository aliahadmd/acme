version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      js-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Python deps are managed by uv (uv.lock) — Dependabot does not support uv;
  # bump versions in apps/api/pyproject.toml and run `make install`.
