name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: ./apps/api
          - app: web
            context: .
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.PUBLIC_API_URL }}

  deploy:
    name: trigger dokploy deploy
    runs-on: ubuntu-latest
    needs: build-push
    # Skips (instead of failing) until Dokploy is set up: create the repo
    # variable DOKPLOY_DEPLOY_ENABLED=true plus the secrets in deploy/README.md.
    if: ${{ vars.DOKPLOY_DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy api
        run: |
          curl -sf -X POST "${{ secrets.DOKPLOY_URL }}/api/applications.deploy" \
            -H "x-dokploy-token: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "content-type: application/json" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_API_APP_ID }}"}'
      - name: Deploy web
        run: |
          curl -sf -X POST "${{ secrets.DOKPLOY_URL }}/api/applications.deploy" \
            -H "x-dokploy-token: ${{ secrets.DOKPLOY_TOKEN }}" \
            -H "content-type: application/json" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_WEB_APP_ID }}"}'
